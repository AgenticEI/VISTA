[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.0.0"
authors = [{ name = "RPent Contributors" }]
description = "VISTA: active exploration for robot Harness development (LIBERO-Pro release)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "jsonschema>=4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "imageio>=2.0",
    "PyYAML>=6.0",
    "pillow>=10",
    "msgpack>=1.0",
    "websockets>=15",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-memory = "rpent.cli.memory:main"
rpent-evolve = "meta_harness.cli:main"

[project.urls]
Homepage = "https://agenticei.github.io/VISTA-page/"
Repository = "https://github.com/AgenticEI/VISTA"
"Bug Report" = "https://github.com/AgenticEI/VISTA/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-subtests>=0.14",
]
openpi = [
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@rpent",
]
libero = [
    "rpent-libero>=0.2.0",
    # MuJoCo 3.4+ changes LIBERO settling, misplacing objects and reducing task success; see https://github.com/RLinf/RLinf/issues/1460.
    "mujoco==3.3.0",
    "h5py",
]
libero-pro = [
    "rpent[libero]",
    "rpent-liberopro>=0.2.0",
]
sam3 = [
    "sam3==0.1.4",
    "torch",
    "torchvision",
    "pillow>=10",
]
full = [
    "rpent[openpi,libero-pro,sam3]",
]

[tool.uv]
prerelease = "allow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rpent*", "meta_harness*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"meta_harness" = [
    "assets/skills/evolve-harness/SKILL.md",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
